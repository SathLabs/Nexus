plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    alias(libs.plugins.lombok)
    alias(libs.plugins.moddev)
    alias(libs.plugins.modpublisher)
}

version = "${mod_version}+${mc_version}"
group = mod_group_id

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

base {
    archivesName = mod_id
}

java {
    withJavadocJar()
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

java.registerFeature('gametest') {
    usingSourceSet(sourceSets.gametest)
    withSourcesJar()
}

tasks.named('build') {
    dependsOn tasks.named('gametestJar'), tasks.named('gametestSourcesJar')
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
    gametestRuntimeOnly.extendsFrom runtimeOnly

    testCompileOnly.extendsFrom compileOnly
}

// A directory of its own per run: both sides put their measurements next to the report, under the one baseline id.
def gametestServerReport = layout.buildDirectory.file('reports/gametest/server/server.xml').get().asFile
def gametestClientReport = layout.buildDirectory.file('reports/gametest/client/client.xml').get().asFile

neoForge {
    version = neo_version

    addModdingDependenciesTo(sourceSets.gametest)

    validateAccessTransformers = true

    accessTransformers {
        from 'src/main/resources/META-INF/accesstransformer.cfg'
    }

    interfaceInjectionData {
        from 'src/main/resources/META-INF/interfaces.json'
    }

    runs {
        client {
            client()
            gameDirectory = file('runs/client')
        }

        server {
            server()
            programArgument '--nogui'
            gameDirectory = file('runs/server')
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('runs/gametest')
            systemProperty 'neoforge.enableGameTest', 'true'
            programArguments.addAll '--report', gametestServerReport.absolutePath
            systemProperty 'nexus.gametest.report', gametestServerReport.absolutePath

            def selector = project.hasProperty('tests') ? project.property('tests').toString() : ''
            if (!selector.isEmpty()) {
                def namespaced = selector.contains(':') ? selector : '*:' + selector
                programArguments.addAll '--tests', namespaced
                systemProperty 'nexus.gametest.tests', namespaced
            }

            if (project.hasProperty('realtime')) {
                def realtime = project.property('realtime').toString()
                systemProperty 'nexus.gametest.realtime', realtime.isEmpty() ? 'true' : realtime
            }

            def compare = project.hasProperty('compare') ? project.property('compare').toString() : ''
            if (!compare.isEmpty()) {
                systemProperty 'nexus.gametest.compare', file(compare).absolutePath
            }
        }

        gameTestClient {
            client()
            gameDirectory = file('runs/gametest-client')
            systemProperty 'nexus.gametest.report', gametestClientReport.absolutePath

            def selector = project.hasProperty('tests') ? project.property('tests').toString() : ''
            if (!selector.isEmpty()) {
                systemProperty 'nexus.gametest.tests', selector.contains(':') ? selector : '*:' + selector
            }

            if (project.hasProperty('realtime')) {
                def realtime = project.property('realtime').toString()
                systemProperty 'nexus.gametest.realtime', realtime.isEmpty() ? 'true' : realtime
            }

            if (project.hasProperty('show')) {
                def show = project.property('show').toString()
                systemProperty 'nexus.gametest.show', show.isEmpty() ? 'true' : show
            }

            def compare = project.hasProperty('compare') ? project.property('compare').toString() : ''
            if (!compare.isEmpty()) {
                systemProperty 'nexus.gametest.compare', file(compare).absolutePath
            }

            def goldens = project.hasProperty('goldens') ? project.property('goldens').toString() : ''
            if (!goldens.isEmpty()) {
                systemProperty 'nexus.gametest.goldens', file(goldens).absolutePath
            }

            if (project.hasProperty('record')) {
                def record = project.property('record').toString()
                systemProperty 'nexus.gametest.record', record.isEmpty() ? 'true' : record
            }
        }

        data {
            clientData()
            gameDirectory = file('runs/data')
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }

        configureEach {
            sourceSet = sourceSets.gametest
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.test
        }

        "${mod_id}_gametest" {
            sourceSet sourceSets.gametest
        }
    }

    unitTest {
        enable()
        testedMod = mods.named(mod_id)
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'

    exclude '**/*.bbmodel'
    exclude '**/.cache/**'
}

dependencies {
    implementation libs.zelqro
    jarJar libs.zelqro

    gametestApi(project)
    gametestApi libs.assertj.core
    gametestApi platform(libs.junit.bom)
    gametestApi libs.junit.platform.commons

    testImplementation sourceSets.gametest.output
    testImplementation libs.assertj.core

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

