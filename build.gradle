// Deletes the report and every measurement file of the previous run, so a stale file can't pass the checks.
def clearGameTestRun = { report, run ->
    report.parentFile.mkdirs()
    report.delete()
    (run.measurements.keySet() + run.unmeasured).each { path ->
        new File(report.parentFile, path + '.json').delete()
        new File(report.parentFile, path + '.txt').delete()
    }
}

// Checks the report and the measurement files of a run against what the run should leave behind.
// Every 'nexus:' test the run reports has to be in its data.
// If the run was started with a '-Ptests' selector, only the cases it reported are checked.
def verifyGameTestRun = { report, run, selected ->
    if (!report.isFile()) {
        throw new GradleException("The run wrote no report to '${report}'")
    }

    def cases = new groovy.xml.XmlSlurper().parse(report).'**'.findAll { node -> node.name() == 'testcase' }
    def failed = cases.findAll { testCase -> !testCase.failure.isEmpty() }.collect { testCase -> "'${testCase.@name}'" }
    if (!failed.isEmpty()) {
        throw new GradleException("Required tests failed: ${failed.join(', ')}")
    }

    run.cases.each { id, expected ->
        def reported = cases.findAll { testCase -> testCase.@name.text() == id }
        if (reported.isEmpty() && !selected) {
            throw new GradleException("The run did not report '${id}'")
        }

        reported.each { testCase ->
            def result = testCase.children()
            def outcome = result.isEmpty() ? 'passed' : result[0].name()
            if (outcome != expected[0]) {
                throw new GradleException("'${id}' ended as '${outcome}' instead of '${expected[0]}'")
            }

            def message = result.@message.text()
            if (expected.size() > 1 && !message.contains(expected[1])) {
                throw new GradleException("'${id}' failed with '${message}' instead of '${expected[1]}'")
            }
        }
    }

    if (selected) {
        return
    }

    def unknown = cases.collect { testCase -> testCase.@name.text() }.findAll { id -> id.startsWith('nexus:') && !run.cases.containsKey(id) }
    if (!unknown.isEmpty()) {
        throw new GradleException("The run reported tests without an expected outcome: ${unknown.collect { id -> "'${id}'" }.join(', ')}")
    }

    run.measurements.each { path, measurement ->
        def file = new File(report.parentFile, path + '.json')
        if (!file.isFile()) {
            throw new GradleException("The run wrote no measurement to '${path}.json'")
        }

        def nanos = new groovy.json.JsonSlurper().parse(file).nanos
        if (nanos.size() != measurement.window) {
            throw new GradleException("'${path}.json' holds '${nanos.size()}' ticks or frames instead of '${measurement.window}'")
        }

        def profile = new File(report.parentFile, path + '.txt').isFile()
        if (profile != measurement.profile) {
            throw new GradleException("The run wrote ${profile ? 'a' : 'no'} profile to '${path}.txt'")
        }
    }

    run.unmeasured.each { path ->
        if (new File(report.parentFile, path + '.json').exists() || new File(report.parentFile, path + '.txt').exists()) {
            throw new GradleException("The run wrote a measurement to '${path}'")
        }
    }
}

tasks.named('runGameTestServer', JavaExec) {
    def selected = project.hasProperty('tests') && !project.property('tests').toString().isEmpty()

    doFirst {
        clearGameTestRun(gametestServerReport, serverRun)
    }

    doLast {
        verifyGameTestRun(gametestServerReport, serverRun, selected)
    }
}

// The pid of the virtual screen a -Pxvfb run draws into, so the finalizer stops it however the run ended.
def xvfbPid = layout.buildDirectory.file('tmp/xvfb.pid').get().asFile

def stopXvfb = tasks.register('stopXvfb') {
    description = 'Stops the virtual screen a client test run was given.'

    doLast {
        if (xvfbPid.isFile()) {
            ProcessHandle.of(xvfbPid.text.trim() as long).ifPresent { screen -> screen.destroy() }
            xvfbPid.delete()
        }
    }
}

tasks.named('runGameTestClient', JavaExec) {
    def fmlConfig = file('runs/gametest-client/config/fml.toml')
    def xvfb = project.hasProperty('xvfb')
    def selected = project.hasProperty('tests') && !project.property('tests').toString().isEmpty()

    if (xvfb) {
        finalizedBy stopXvfb
    }

    doFirst {
        clearGameTestRun(gametestClientReport, clientRun)

        // FML's early loading screen opens a window before any mixin can hide it; every other key of the file is FML's own.
        def control = 'earlyWindowControl = false'
        def lines = fmlConfig.isFile() ? fmlConfig.readLines() : []
        def existing = lines.findIndexOf { line -> line.trim().startsWith('earlyWindowControl') }
        if (existing < 0) {
            lines.add(control)
        } else {
            lines.set(existing, control)
        }

        fmlConfig.parentFile.mkdirs()
        fmlConfig.text = lines.join('\n') + '\n'

        if (!xvfb) {
            return
        }

        def display = (99..198).find { number -> !new File('/tmp/.X11-unix/X' + number).exists() }
        if (display == null) {
            throw new GradleException('every display from :99 to :198 is taken')
        }

        def screen = new ProcessBuilder('/usr/bin/Xvfb', ':' + display, '-screen', '0', '1920x1080x24').inheritIO().start()
        xvfbPid.parentFile.mkdirs()
        xvfbPid.text = String.valueOf(screen.pid())

        // The client opens the display as it starts, so the run waits for the socket Xvfb puts up.
        def socket = new File('/tmp/.X11-unix/X' + display)
        def deadline = System.currentTimeMillis() + 10_000
        while (!socket.exists()) {
            if (!screen.isAlive() || System.currentTimeMillis() > deadline) {
                throw new GradleException('Xvfb never came up on :' + display)
            }

            Thread.sleep(50L)
        }

        it.environment 'DISPLAY', ':' + display
    }

    doLast {
        verifyGameTestRun(gametestClientReport, clientRun, selected)
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('generateModMetadata', ProcessResources) {
    description = 'Generates the mod metadata file for the mod.'

    def replacements = [
            minecraft_version      : mc_version,
            minecraft_version_range: mc_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]

    inputs.properties replacements
    expand replacements
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir tasks.named('generateModMetadata')
neoForge.ideSyncTask tasks.named('generateModMetadata')

tasks.register('generateGametestModMetadata', ProcessResources) {
    description = 'Generates the mod metadata file for the gametest mod.'

    def replacements = [
            minecraft_version_range: mc_version_range,
            neo_version            : neo_version,
            mod_id                 : "${mod_id}_gametest",
            parent_mod_id          : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]

    inputs.properties replacements
    expand replacements
    from 'src/gametest/templates'
    into 'build/generated/sources/gametestModMetadata'
}
sourceSets.gametest.resources.srcDir tasks.named('generateGametestModMetadata')
neoForge.ideSyncTask tasks.named('generateGametestModMetadata')

