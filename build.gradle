plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    alias(libs.plugins.lombok)
    alias(libs.plugins.moddev)
    alias(libs.plugins.modpublisher)
}

version = "${mod_version}+${mc_version}"
group = mod_group_id

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

base {
    archivesName = mod_id
}

java {
    withJavadocJar()
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

java.registerFeature('gametest') {
    usingSourceSet(sourceSets.gametest)
    withSourcesJar()
}

tasks.named('build') {
    dependsOn tasks.named('gametestJar'), tasks.named('gametestSourcesJar')
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
    gametestRuntimeOnly.extendsFrom runtimeOnly

    testCompileOnly.extendsFrom compileOnly
}

def gametestServerReport = layout.buildDirectory.file('reports/gametest/server.xml').get().asFile
def gametestClientReport = layout.buildDirectory.file('reports/gametest/client.xml').get().asFile

neoForge {
    version = neo_version

    addModdingDependenciesTo(sourceSets.gametest)

    validateAccessTransformers = true

    accessTransformers {
        from 'src/main/resources/META-INF/accesstransformer.cfg'
    }

    interfaceInjectionData {
        from 'src/main/resources/META-INF/interfaces.json'
    }

    runs {
        client {
            client()
            gameDirectory = file('runs/client')
        }

        server {
            server()
            programArgument '--nogui'
            gameDirectory = file('runs/server')
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('runs/gametest')
            systemProperty 'neoforge.enableGameTest', 'true'
            programArguments.addAll '--report', gametestServerReport.absolutePath
            systemProperty 'nexus.gametest.report', gametestServerReport.absolutePath

            def selector = project.hasProperty('tests') ? project.property('tests').toString() : ''
            if (!selector.isEmpty()) {
                def namespaced = selector.contains(':') ? selector : '*:' + selector
                programArguments.addAll '--tests', namespaced
                systemProperty 'nexus.gametest.tests', namespaced
            }

            if (project.hasProperty('realtime')) {
                def realtime = project.property('realtime').toString()
                systemProperty 'nexus.gametest.realtime', realtime.isEmpty() ? 'true' : realtime
            }

            def compare = project.hasProperty('compare') ? project.property('compare').toString() : ''
            if (!compare.isEmpty()) {
                systemProperty 'nexus.gametest.compare', file(compare).absolutePath
            }
        }

        gameTestClient {
            client()
            gameDirectory = file('runs/gametest-client')
            systemProperty 'nexus.gametest.report', gametestClientReport.absolutePath

            def selector = project.hasProperty('tests') ? project.property('tests').toString() : ''
            if (!selector.isEmpty()) {
                systemProperty 'nexus.gametest.tests', selector.contains(':') ? selector : '*:' + selector
            }

            if (project.hasProperty('realtime')) {
                def realtime = project.property('realtime').toString()
                systemProperty 'nexus.gametest.realtime', realtime.isEmpty() ? 'true' : realtime
            }

            if (project.hasProperty('show')) {
                def show = project.property('show').toString()
                systemProperty 'nexus.gametest.show', show.isEmpty() ? 'true' : show
            }
        }

        data {
            clientData()
            gameDirectory = file('runs/data')
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }

        configureEach {
            sourceSet = sourceSets.gametest
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.test
        }

        "${mod_id}_gametest" {
            sourceSet sourceSets.gametest
        }
    }

    unitTest {
        enable()
        testedMod = mods.named(mod_id)
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'

    exclude '**/*.bbmodel'
    exclude '**/.cache/**'
}

dependencies {
    implementation libs.zelqro
    jarJar libs.zelqro

    gametestApi(project)
    gametestApi libs.assertj.core
    gametestApi platform(libs.junit.bom)
    gametestApi libs.junit.platform.commons

    testImplementation sourceSets.gametest.output
    testImplementation libs.assertj.core

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

tasks.named('runGameTestServer', JavaExec) {
    def reports = gametestServerReport.parentFile

    // The windows TickWindowSamples declares, and the baseline of the run, which is as long as the longest of them.
    def windows = [
            'nexus/tick_window_samples/window.json'         : 7,
            'nexus/tick_window_samples/profiled_window.json': 3,
            'nexus_gametest/baseline.json'                  : 7,
    ]
    def profile = 'nexus/tick_window_samples/profiled_window.txt'
    def selected = project.hasProperty('tests')

    doFirst {
        reports.mkdirs()
        windows.keySet().each { new File(reports, it).delete() }
        new File(reports, profile).delete()
    }

    doLast {
        if (selected) {
            return
        }

        windows.each { path, window ->
            def file = new File(reports, path)
            if (!file.isFile()) {
                throw new GradleException("the run wrote no measurement to ${path}")
            }

            def nanos = new groovy.json.JsonSlurper().parse(file).nanos
            if (nanos.size() != window) {
                throw new GradleException("${path} holds ${nanos.size()} samples, and not the ${window} of its window")
            }
        }

        if (!new File(reports, profile).isFile()) {
            throw new GradleException("the run wrote no profiler breakdown to ${profile}")
        }
    }
}

// The pid of the virtual screen a -Pxvfb run draws into, so the finalizer stops it however the run ended.
def xvfbPid = layout.buildDirectory.file('tmp/xvfb.pid').get().asFile

def stopXvfb = tasks.register('stopXvfb') {
    description = 'Stops the virtual screen a client test run was given.'

    doLast {
        if (xvfbPid.isFile()) {
            ProcessHandle.of(xvfbPid.text.trim() as long).ifPresent { screen -> screen.destroy() }
            xvfbPid.delete()
        }
    }
}

tasks.named('runGameTestClient', JavaExec) {
    def fmlConfig = file('runs/gametest-client/config/fml.toml')
    def xvfb = project.hasProperty('xvfb')

    if (xvfb) {
        finalizedBy stopXvfb
    }

    doFirst {
        gametestClientReport.parentFile.mkdirs()
        gametestClientReport.delete()

        // FML's early loading screen opens a window before any mixin can hide it; every other key of the file is FML's own.
        def control = 'earlyWindowControl = false'
        def lines = fmlConfig.isFile() ? fmlConfig.readLines() : []
        def existing = lines.findIndexOf { line -> line.trim().startsWith('earlyWindowControl') }
        if (existing < 0) {
            lines.add(control)
        } else {
            lines.set(existing, control)
        }

        fmlConfig.parentFile.mkdirs()
        fmlConfig.text = lines.join('\n') + '\n'

        if (!xvfb) {
            return
        }

        def display = (99..198).find { number -> !new File('/tmp/.X11-unix/X' + number).exists() }
        if (display == null) {
            throw new GradleException('every display from :99 to :198 is taken')
        }

        def screen = new ProcessBuilder('/usr/bin/Xvfb', ':' + display, '-screen', '0', '1920x1080x24').inheritIO().start()
        xvfbPid.parentFile.mkdirs()
        xvfbPid.text = String.valueOf(screen.pid())

        // The client opens the display as it starts, so the run waits for the socket Xvfb puts up.
        def socket = new File('/tmp/.X11-unix/X' + display)
        def deadline = System.currentTimeMillis() + 10_000
        while (!socket.exists()) {
            if (!screen.isAlive() || System.currentTimeMillis() > deadline) {
                throw new GradleException('Xvfb never came up on :' + display)
            }

            Thread.sleep(50L)
        }

        it.environment 'DISPLAY', ':' + display
    }

    doLast {
        if (!gametestClientReport.isFile()) {
            throw new GradleException('the run wrote no report to ' + gametestClientReport)
        }
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('generateModMetadata', ProcessResources) {
    description = 'Generates the mod metadata file for the mod.'

    def replacements = [
            minecraft_version      : mc_version,
            minecraft_version_range: mc_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]

    inputs.properties replacements
    expand replacements
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir tasks.named('generateModMetadata')
neoForge.ideSyncTask tasks.named('generateModMetadata')

tasks.register('generateGametestModMetadata', ProcessResources) {
    description = 'Generates the mod metadata file for the gametest mod.'

    def replacements = [
            minecraft_version_range: mc_version_range,
            neo_version            : neo_version,
            mod_id                 : "${mod_id}_gametest",
            parent_mod_id          : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]

    inputs.properties replacements
    expand replacements
    from 'src/gametest/templates'
    into 'build/generated/sources/gametestModMetadata'
}
sourceSets.gametest.resources.srcDir tasks.named('generateGametestModMetadata')
neoForge.ideSyncTask tasks.named('generateGametestModMetadata')

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri(layout.projectDirectory.dir('repo'))
        }
    }
}

publisher {
    curseID = '1645741'
    modrinthID = 'UwfWbVYN'

    github {
        repo 'SathLabs/Nexus'
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
