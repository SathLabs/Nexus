license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name} Consumer"
authors="Satherov"
description='''
A second mod built on ${mod_name}, for gametests that take two mods
'''

[[dependencies.${mod_id}]]
    modId="${parent_mod_id}"
    type="required"
    versionRange="[${mod_version}]"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
