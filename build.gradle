plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    alias(libs.plugins.lombok)
    alias(libs.plugins.moddev)
    alias(libs.plugins.modpublisher)
}

version = "${mod_version}+${mc_version}"
group = mod_group_id

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

base {
    archivesName = mod_id
}

java {
    withJavadocJar()
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

java.registerFeature('gametest') {
    usingSourceSet(sourceSets.gametest)
    withSourcesJar()
}

tasks.named('build') {
    dependsOn tasks.named('gametestJar'), tasks.named('gametestSourcesJar')
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
    gametestRuntimeOnly.extendsFrom runtimeOnly

    testCompileOnly.extendsFrom compileOnly
}

def gametestReport = layout.buildDirectory.file('reports/gametest/server.xml').get().asFile

neoForge {
    version = neo_version

    addModdingDependenciesTo(sourceSets.gametest)

    validateAccessTransformers = true

    accessTransformers {
        from 'src/main/resources/META-INF/accesstransformer.cfg'
    }

    interfaceInjectionData {
        from 'src/main/resources/META-INF/interfaces.json'
    }

    runs {
        client {
            client()
            gameDirectory = file('runs/client')
        }

        server {
            server()
            programArgument '--nogui'
            gameDirectory = file('runs/server')
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('runs/gametest')
            systemProperty 'neoforge.enableGameTest', 'true'
            programArguments.addAll '--report', gametestReport.absolutePath
        }

        data {
            clientData()
            gameDirectory = file('runs/data')
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }

        configureEach {
            sourceSet = sourceSets.gametest
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.test
        }

        "${mod_id}_gametest" {
            sourceSet sourceSets.gametest
        }
    }

    unitTest {
        enable()
        testedMod = mods.named(mod_id)
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'

    exclude '**/*.bbmodel'
    exclude '**/.cache/**'
}

dependencies {
    implementation libs.zelqro
    jarJar libs.zelqro

    gametestApi(project)
    gametestApi libs.assertj.core

    testImplementation sourceSets.gametest.output
    testImplementation libs.assertj.core

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

tasks.named('runGameTestServer', JavaExec) {
    def reports = gametestReport.parentFile

    doFirst {
        reports.mkdirs()
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('generateModMetadata', ProcessResources) {
    description = 'Generates the mod metadata file for the mod.'

    def replacements = [
            minecraft_version      : mc_version,
            minecraft_version_range: mc_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]

    inputs.properties replacements
    expand replacements
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir tasks.named('generateModMetadata')
neoForge.ideSyncTask tasks.named('generateModMetadata')

tasks.register('generateGametestModMetadata', ProcessResources) {
    description = 'Generates the mod metadata file for the gametest mod.'

    def replacements = [
            minecraft_version_range: mc_version_range,
            neo_version            : neo_version,
            mod_id                 : "${mod_id}_gametest",
            parent_mod_id          : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]

    inputs.properties replacements
    expand replacements
    from 'src/gametest/templates'
    into 'build/generated/sources/gametestModMetadata'
}
sourceSets.gametest.resources.srcDir tasks.named('generateGametestModMetadata')
neoForge.ideSyncTask tasks.named('generateGametestModMetadata')

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri(layout.projectDirectory.dir('repo'))
        }
    }
}

publisher {
    curseID = '1645741'
    modrinthID = 'UwfWbVYN'

    github {
        repo 'SathLabs/Nexus'
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
