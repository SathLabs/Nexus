plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    alias(libs.plugins.lombok)
    alias(libs.plugins.moddev)
    alias(libs.plugins.modpublisher)
    alias(libs.plugins.nexus.gradle)
}

version = "${mod_version}+${mc_version}"
group = mod_group_id

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

base {
    archivesName = mod_id
}

java {
    withJavadocJar()
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }

    // A second mod on Nexus for the gametests of cases that take two mods, built against the api like any other mod.
    consumer {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }

    test {
        compileClasspath += sourceSets.consumer.output
        runtimeClasspath += sourceSets.consumer.output
    }
}

java.registerFeature('gametest') {
    usingSourceSet(sourceSets.gametest)
    withSourcesJar()
}

tasks.named('build') {
    dependsOn tasks.named('gametestJar'), tasks.named('gametestSourcesJar')
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
    gametestRuntimeOnly.extendsFrom runtimeOnly
    consumerImplementation.extendsFrom implementation
    consumerCompileOnly.extendsFrom compileOnly
    consumerRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    version = neo_version

    addModdingDependenciesTo(sourceSets.gametest)
    addModdingDependenciesTo(sourceSets.consumer)

    validateAccessTransformers = true

    accessTransformers {
        from 'src/main/resources/META-INF/accesstransformer.cfg'
    }

    interfaceInjectionData {
        from 'src/main/resources/META-INF/interfaces.json'
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        // A dedicated server started with the dist cleaned, as in production, which the gametest server is not.
        serverStart {
            server()
            programArgument '--nogui'
        }

        data {
            clientData()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }

        "${mod_id}_gametest" {
            sourceSet sourceSets.gametest
        }

        "${mod_id}_consumer" {
            sourceSet sourceSets.consumer
        }
    }

    unitTest {
        enable()
        testedMod = mods.named(mod_id)
    }
}

nexus {
    gametest {
        modId = mod_id
        sourceSet = sourceSets.test
        harness = dependencies.create(sourceSets.gametest.output)

        clients {
            shaders {
                mods libs.iris
                mods libs.sodium
                systemProperties.put('nexus.gametest.shaderpack', 'sample')
                systemProperties.put('nexus.test.stencil', 'true')
            }
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'

    exclude '**/*.bbmodel'
    exclude '**/.cache/**'
}

dependencies {
    implementation libs.zelqro
    jarJar libs.zelqro
    compileOnly libs.mcdev.annotations
    compileOnly(libs.iris) {
        transitive = false
    }
    gametestCompileOnly libs.sodium.mod

    gametestApi project(':')
    gametestApi libs.assertj.core
    gametestApi platform(libs.junit.bom)
    gametestApi libs.junit.platform.commons

    testImplementation(libs.archunit) {
        // Minecraft pins slf4j strictly, and ArchUnit runs on whatever version that is.
        exclude group: 'org.slf4j'
    }
    testImplementation libs.assertj.core

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

tasks.named('test', Test) {
    useJUnitPlatform()
    filter {
        excludeTestsMatching 'dev.satherov.nexus.test.unit.gametest.RunReportTest'
    }

    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

def verifyGameTests = { Test task, String runs ->
    task.group = 'verification'
    task.testClassesDirs = sourceSets.test.output.classesDirs

    // FML's JUnit launcher would boot the game here, and that needs the arguments moddev only gives the test task.
    task.classpath = sourceSets.test.runtimeClasspath.filter { file -> !file.name.startsWith('junit-fml') }
    task.useJUnitPlatform()
    task.filter {
        includeTestsMatching 'dev.satherov.nexus.test.unit.gametest.RunReportTest'
    }

    task.doNotTrackState 'The runs rewrite the reports it checks'
    task.systemProperty 'nexus.gametest.reports', layout.buildDirectory.dir('reports/gametest').get().asFile.absolutePath
    task.systemProperty 'nexus.gametest.runs', runs
    def tests = providers.gradleProperty('tests').getOrElse('')
    if (!tests.isEmpty()) {
        task.systemProperty 'nexus.gametest.tests', tests
    }
}

tasks.register('verifyGameTestRuns', Test) {
    description = 'Runs every gametest run and then checks their reports.'
    verifyGameTests(it, '')
    dependsOn 'runGameTestServer', 'runGameTestClient', 'runGameTestClientShaders'
}

tasks.register('verifyGameTestServer', Test) {
    description = 'Runs the server gametests and then checks their report, which needs no display and runs in CI.'
    verifyGameTests(it, 'server')
    dependsOn 'runGameTestServer'
}

tasks.named('runServerStart', JavaExec) {
    description = 'Starts a dedicated server with the dist cleaned, stops it once the world is loaded, and fails on a client class.'
    group = 'verification'

    def directory = file('runs/serverStart')
    def log = new File(directory, 'logs/latest.log')

    // The library and the harness only: the samples join the nexus mod in every run, and many of them don't link on a
    // dedicated server yet.
    def modClasses = (sourceSets.main.output.files.collect { "${mod_id}%%${it}" } +
            sourceSets.gametest.output.files.collect { "${mod_id}_gametest%%${it}" } +
            sourceSets.consumer.output.files.collect { "${mod_id}_consumer%%${it}" })
            .join(File.pathSeparator)
    doFirst {
        environment 'MOD_CLASSES', modClasses
        directory.mkdirs()
        new File(directory, 'eula.txt').text = 'eula=true\n'
        log.delete()

        // A stop read before the world exists fails, so it is typed once the log says the server is done starting.
        def console = new PipedOutputStream()
        standardInput = new PipedInputStream(console)
        Thread.ofPlatform().daemon().name('server start stopper').start {
            def deadline = System.currentTimeMillis() + 600_000L
            while (System.currentTimeMillis() < deadline && !(log.exists() && log.getText('UTF-8').contains('Done ('))) {
                Thread.sleep(1_000L)
            }
            console.write('stop\n'.getBytes('UTF-8'))
            console.close()
        }
    }
    doLast {
        def text = log.exists() ? log.getText('UTF-8') : ''
        if (text.contains('Attempted to load class')) {
            throw new GradleException("The dedicated server loaded a client class, see ${log}")
        }
        if (!text.contains('Done (')) {
            throw new GradleException("The dedicated server did not finish starting, see ${log}")
        }
    }
}

tasks.named('runGameTestClient') {
    mustRunAfter 'runGameTestServer'
}

tasks.named('runGameTestClientShaders') {
    mustRunAfter 'runGameTestClient'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('generateModMetadata', ProcessResources) {
    description = 'Generates the mod metadata file for the mod.'

    def replacements = [
            minecraft_version      : mc_version,
            minecraft_version_range: mc_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]

    inputs.properties replacements
    expand replacements
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir tasks.named('generateModMetadata')
neoForge.ideSyncTask tasks.named('generateModMetadata')

tasks.register('generateGametestModMetadata', ProcessResources) {
    description = 'Generates the mod metadata file for the gametest mod.'

    def replacements = [
            minecraft_version_range: mc_version_range,
            neo_version            : neo_version,
            mod_id                 : "${mod_id}_gametest",
            parent_mod_id          : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]

    inputs.properties replacements
    expand replacements
    from 'src/gametest/templates'
    into 'build/generated/sources/gametestModMetadata'
}
sourceSets.gametest.resources.srcDir tasks.named('generateGametestModMetadata')
neoForge.ideSyncTask tasks.named('generateGametestModMetadata')

tasks.register('generateConsumerModMetadata', ProcessResources) {
    description = 'Generates the mod metadata file for the consumer mod.'

    def replacements = [
            minecraft_version_range: mc_version_range,
            neo_version            : neo_version,
            mod_id                 : "${mod_id}_consumer",
            parent_mod_id          : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]

    inputs.properties replacements
    expand replacements
    from 'src/consumer/templates'
    into 'build/generated/sources/consumerModMetadata'
}
sourceSets.consumer.resources.srcDir tasks.named('generateConsumerModMetadata')
neoForge.ideSyncTask tasks.named('generateConsumerModMetadata')

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri(layout.projectDirectory.dir('repo'))
        }
    }
}

publisher {
    curseID = '1645741'
    modrinthID = 'UwfWbVYN'

    github {
        repo 'SathLabs/Nexus'
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
